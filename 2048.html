  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Nunito:wght@700;800;900&display=swap');
    
    body {
      font-family: 'Fredoka', 'Nunito', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .friv-bg {
      background-color: #0b1120;
      background-image: 
        radial-gradient(circle at 25px 25px, rgba(255, 255, 255, 0.08) 2%, transparent 0%),
        radial-gradient(circle at 75px 75px, rgba(255, 255, 255, 0.04) 3%, transparent 0%);
      background-size: 80px 80px;
    }

    /* Dinamikus tábla térközök */
    .board-wrap {
      --b-pad: 12px;
      --b-gap: 10px;
    }
    .duel-board-wrap {
      --b-pad: 10px;
      --b-gap: 8px;
    }

    /* Csúszó animációs kocka konténer */
    .tile-node {
      position: absolute;
      width: calc((100% - (3 * var(--b-gap))) / 4);
      height: calc((100% - (3 * var(--b-gap))) / 4);
      transition: transform 115ms cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .tile-inner {
      width: 100%;
      height: 100%;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      user-select: none;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.25);
    }

    /* Új kocka születési animáció */
    @keyframes popAppear {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.1); opacity: 0.9; }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-new {
      animation: popAppear 140ms cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* Összeolvadási (merge) ruganyos animáció */
    @keyframes popMerge {
      0% { transform: scale(1); }
      50% { transform: scale(1.22); }
      100% { transform: scale(1); }
    }
    .pop-merge {
      animation: popMerge 150ms cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* 2048 Csempe színek */
    .tile-2 { background-color: #eee4da; color: #776e65; }
    .tile-4 { background-color: #ede0c8; color: #776e65; }
    .tile-8 { background-color: #f2b179; color: #f9f6f2; }
    .tile-16 { background-color: #f59563; color: #f9f6f2; }
    .tile-32 { background-color: #f67c5f; color: #f9f6f2; }
    .tile-64 { background-color: #e95938; color: #f9f6f2; }
    .tile-128 { background-color: #ecc95f; color: #f9f6f2; box-shadow: 0 0 12px rgba(236, 201, 95, 0.4); }
    .tile-256 { background-color: #ecc44d; color: #f9f6f2; box-shadow: 0 0 16px rgba(236, 196, 77, 0.5); }
    .tile-512 { background-color: #ebbe3b; color: #f9f6f2; box-shadow: 0 0 20px rgba(235, 190, 59, 0.6); }
    .tile-1024 { background-color: #10b981; color: #ffffff; box-shadow: 0 0 22px rgba(16, 185, 129, 0.6); }
    .tile-2048 { background-color: #6366f1; color: #fbbf24; box-shadow: 0 0 25px rgba(99, 102, 241, 0.8); border: 3px solid #fbbf24; animation: pulseWin 1.5s infinite; }

    @keyframes pulseWin {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .tap-btn {
      transition: transform 0.08s ease, filter 0.08s ease;
    }
    .tap-btn:active {
      transform: scale(0.93) translateY(2px);
      filter: brightness(0.92);
    }
  </style>

  <script>
    let soundEnabled = true;
    let audioCtx = null;
    let nextTileId = 1;

    function getAudioCtx() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTone(freq, type = 'sine', duration = 0.05) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('soundIcon');
      const text = document.getElementById('soundText');
      if (soundEnabled) {
        icon.className = 'ph-bold ph-speaker-high text-base';
        text.textContent = 'Hang: BE';
        playTone(600);
      } else {
        icon.className = 'ph-bold ph-speaker-slash text-base';
        text.textContent = 'Hang: KI';
      }
    }

    let currentMode = 1;
    let activeModalPlayer = 1;

    let p1Data = {
      tiles: [],
      score: 0,
      won: false,
      isMoving: false
    };
    let p2Data = {
      tiles: [],
      score: 0,
      won: false,
      isMoving: false
    };

    let p1Best = parseInt(localStorage.getItem('board_2048_best') || '0', 10);

    function switchGameMode(mode) {
      currentMode = mode;
      playTone(520);
      const b1 = document.getElementById('modeBtn1P');
      const b2 = document.getElementById('modeBtn2P');
      const v1 = document.getElementById('view1Player');
      const v2 = document.getElementById('view2Player');
      const badge = document.getElementById('currentModeBadge');

      if (mode === 1) {
        b1.className = 'px-4 py-2 rounded-xl text-xs sm:text-sm font-black transition-all bg-indigo-600 text-white shadow-md flex items-center gap-1.5';
        b2.className = 'px-4 py-2 rounded-xl text-xs sm:text-sm font-black transition-all text-slate-400 hover:text-white flex items-center gap-1.5';
        v1.classList.remove('hidden');
        v1.classList.add('flex');
        v2.classList.add('hidden');
        v2.classList.remove('grid');
        badge.textContent = '1 Játékos';
        renderBoardDOM(1);
      } else {
        b2.className = 'px-4 py-2 rounded-xl text-xs sm:text-sm font-black transition-all bg-indigo-600 text-white shadow-md flex items-center gap-1.5';
        b1.className = 'px-4 py-2 rounded-xl text-xs sm:text-sm font-black transition-all text-slate-400 hover:text-white flex items-center gap-1.5';
        v1.classList.add('hidden');
        v1.classList.remove('flex');
        v2.classList.remove('hidden');
        v2.classList.add('grid');
        badge.textContent = '2 Játékos Párbaj';
        renderBoardDOM(1);
        renderBoardDOM(2);
      }
    }

    function resetCurrentViewGames() {
      playTone(400);
      resetGame(1);
      if (currentMode === 2) resetGame(2);
    }

    function getTileContainer(pNum) {
      if (currentMode === 1) {
        return document.getElementById('p1TileContainer');
      }
      return document.getElementById(pNum === 1 ? 'duelTileContainer1' : 'duelTileContainer2');
    }

    function resetGame(pNum) {
      const p = pNum === 1 ? p1Data : p2Data;
      p.tiles = [];
      p.score = 0;
      p.won = false;
      p.isMoving = false;

      const container = getTileContainer(pNum);
      if (container) container.innerHTML = '';

      spawnTile(p);
      spawnTile(p);
      renderBoardDOM(pNum);
    }

    function spawnTile(p) {
      const occupied = new Set(p.tiles.map(t => `${t.r},${t.c}`));
      const empty = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (!occupied.has(`${r},${c}`)) empty.push({ r, c });
        }
      }
      if (empty.length === 0) return;
      const pick = empty[Math.floor(Math.random() * empty.length)];
      p.tiles.push({
        id: nextTileId++,
        r: pick.r,
        c: pick.c,
        val: Math.random() < 0.9 ? 2 : 4,
        isNew: true,
        merged: false,
        toRemove: false
      });
    }

    /* Kockák azonnali pozíció-frissítése a csúszási animáció indításához */
    function updateTilePositions(pNum) {
      const p = pNum === 1 ? p1Data : p2Data;
      p.tiles.forEach(t => {
        const el = document.getElementById(`tile-${pNum}-${t.id}`);
        if (el) {
          el.style.transform = `translate(calc(${t.c} * (100% + var(--b-gap))), calc(${t.r} * (100% + var(--b-gap))))`;
          el.style.zIndex = t.toRemove ? '5' : '10';
        }
      });
    }

    /* DOM Teljes kirajzolása */
    function renderBoardDOM(pNum) {
      const p = pNum === 1 ? p1Data : p2Data;
      
      // Pontszámok
      if (currentMode === 1 && pNum === 1) {
        document.getElementById('p1Score').textContent = p.score;
        if (p.score > p1Best) {
          p1Best = p.score;
          localStorage.setItem('board_2048_best', p1Best);
          document.getElementById('p1Best').textContent = p1Best;
        }
      } else {
        const sEl = document.getElementById(pNum === 1 ? 'duelScore1' : 'duelScore2');
        if (sEl) sEl.textContent = p.score;
      }

      const container = getTileContainer(pNum);
      if (!container) return;

      // Meglévő elemek törlése, ha már nincsenek a listában
      const activeIds = new Set(p.tiles.map(t => `tile-${pNum}-${t.id}`));
      Array.from(container.children).forEach(child => {
        if (!activeIds.has(child.id)) {
          child.remove();
        }
      });

      // Elemek létrehozása és frissítése
      p.tiles.forEach(t => {
        let el = document.getElementById(`tile-${pNum}-${t.id}`);
        let fontSizeClass = t.val >= 1024 ? 'text-lg sm:text-xl' : (t.val >= 128 ? 'text-xl sm:text-2xl' : 'text-2xl sm:text-3xl');

        if (!el) {
          el = document.createElement('div');
          el.id = `tile-${pNum}-${t.id}`;
          el.className = 'tile-node';
          el.style.transform = `translate(calc(${t.c} * (100% + var(--b-gap))), calc(${t.r} * (100% + var(--b-gap))))`;
          el.innerHTML = `
            <div class="tile-inner tile-${t.val} ${fontSizeClass} ${t.isNew ? 'pop-new' : ''}">
              ${t.val}
            </div>
          `;
          container.appendChild(el);
          t.isNew = false;
        } else {
          el.style.transform = `translate(calc(${t.c} * (100% + var(--b-gap))), calc(${t.r} * (100% + var(--b-gap))))`;
          const inner = el.querySelector('.tile-inner');
          if (inner) {
            inner.className = `tile-inner tile-${t.val} ${fontSizeClass} ${t.merged ? 'pop-merge' : ''}`;
            inner.textContent = t.val;
          }
        }
      });
    }

    function movePlayer(pNum, direction) {
      const p = pNum === 1 ? p1Data : p2Data;
      if (p.isMoving) return;

      const vector = {
        up: { r: -1, c: 0 },
        down: { r: 1, c: 0 },
        left: { r: 0, c: -1 },
        right: { r: 0, c: 1 }
      }[direction];

      let matrix = Array.from({ length: 4 }, () => Array(4).fill(null));
      p.tiles.forEach(t => {
        if (!t.toRemove) matrix[t.r][t.c] = t;
      });

      let moved = false;
      const rowOrder = (direction === 'down') ? [3, 2, 1, 0] : [0, 1, 2, 3];
      const colOrder = (direction === 'right') ? [3, 2, 1, 0] : [0, 1, 2, 3];

      for (let r of rowOrder) {
        for (let c of colOrder) {
          const tile = matrix[r][c];
          if (!tile) continue;

          let currR = r;
          let currC = c;
          let nextR = currR + vector.r;
          let nextC = currC + vector.c;

          while (nextR >= 0 && nextR < 4 && nextC >= 0 && nextC < 4 && !matrix[nextR][nextC]) {
            currR = nextR;
            currC = nextC;
            nextR = currR + vector.r;
            nextC = currC + vector.c;
          }

          if (
            nextR >= 0 && nextR < 4 && nextC >= 0 && nextC < 4 &&
            matrix[nextR][nextC] &&
            matrix[nextR][nextC].val === tile.val &&
            !matrix[nextR][nextC].merged &&
            !tile.merged
          ) {
            const target = matrix[nextR][nextC];
            matrix[r][c] = null;

            tile.r = nextR;
            tile.c = nextC;
            tile.toRemove = true;

            target.val *= 2;
            target.merged = true;
            p.score += target.val;

            if (target.val === 2048 && !p.won) {
              p.won = true;
              setTimeout(() => triggerWin(pNum), 180);
            }

            moved = true;
          } else if (currR !== r || currC !== c) {
            matrix[r][c] = null;
            matrix[currR][currC] = tile;
            tile.r = currR;
            tile.c = currC;
            moved = true;
          }
        }
      }

      if (moved) {
        p.isMoving = true;
        playTone(pNum === 1 ? 580 : 660, 'sine', 0.04);

        // 1. Kockák animált csúsztatása a célhelyükre
        updateTilePositions(pNum);

        // 2. A csúszás befejeződése után töröljük az összeolvadt kockákat, növeljük az értéket és újat hozunk létre
        setTimeout(() => {
          p.tiles = p.tiles.filter(t => !t.toRemove);
          p.tiles.forEach(t => t.merged = false);

          spawnTile(p);
          renderBoardDOM(pNum);

          p.isMoving = false;
          checkGameOver(pNum);
        }, 115);
      }
    }

    function checkGameOver(pNum) {
      const p = pNum === 1 ? p1Data : p2Data;
      if (p.tiles.length < 16) return;

      let matrix = Array.from({ length: 4 }, () => Array(4).fill(0));
      p.tiles.forEach(t => matrix[t.r][t.c] = t.val);

      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (c < 3 && matrix[r][c] === matrix[r][c + 1]) return;
          if (r < 3 && matrix[r][c] === matrix[r + 1][c]) return;
        }
      }

      playTone(220, 'sawtooth', 0.15);
      openNameModal(pNum, false, true);
    }

    function triggerWin(pNum) {
      playTone(880, 'triangle', 0.2);
      try {
        if (typeof confetti === 'function') {
          confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
        }
      } catch (e) {}
      openNameModal(pNum, true);
    }

    /* RANGSOR */
    function getLeaderboard() {
      try {
        return JSON.parse(localStorage.getItem('board_2048_leaderboard') || '[]');
      } catch (e) {
        return [];
      }
    }

    function renderLeaderboard() {
      const container = document.getElementById('leaderboardList');
      if (!container) return;
      const list = getLeaderboard();
      container.innerHTML = '';
      if (list.length === 0) {
        container.innerHTML = '<span class="text-slate-500 italic text-center my-auto">Még nincs rögzített név.</span>';
        return;
      }
      list.slice(0, 5).forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between p-2 rounded-xl bg-slate-950/70 border border-slate-800 text-slate-300';
        row.innerHTML = `
          <span class="truncate"><span class="text-amber-400 mr-1">${idx + 1}.</span> ${item.name}</span>
          <span class="font-mono text-emerald-400 font-bold">${item.score} p</span>
        `;
        container.appendChild(row);
      });
    }

    function openNameModal(pNum, isWin = false, isGameOver = false) {
      activeModalPlayer = pNum;
      const modal = document.getElementById('nameModal');
      const title = document.getElementById('modalTitle');
      const icon = document.getElementById('modalIcon');
      const input = document.getElementById('playerNameInput');
      if (!modal) return;

      if (isWin) {
        icon.textContent = '👑';
        title.textContent = `${pNum}. Játékos elérte a 2048-at!`;
      } else if (isGameOver) {
        icon.textContent = '🏁';
        title.textContent = 'Nincs több lépés!';
      } else {
        icon.textContent = '📝';
        title.textContent = 'Eredmény mentése';
      }
      if (input) input.value = '';
      modal.classList.remove('hidden');
      if (input) setTimeout(() => input.focus(), 60);
    }

    function closeNameModal() {
      const modal = document.getElementById('nameModal');
      if (modal) modal.classList.add('hidden');
    }

    function savePlayerScore() {
      const input = document.getElementById('playerNameInput');
      const name = (input && input.value.trim()) || 'Névtelen Bajnok';
      const score = (activeModalPlayer === 1 ? p1Data.score : p2Data.score);
      const list = getLeaderboard();
      list.push({ name, score, date: new Date().toLocaleDateString('hu-HU') });
      list.sort((a, b) => b.score - a.score);
      localStorage.setItem('board_2048_leaderboard', JSON.stringify(list));
      closeNameModal();
      renderLeaderboard();
      playTone(784);
    }

    function clearLeaderboard() {
      if (confirm('Biztosan törlöd a 2048 rangsort?')) {
        localStorage.removeItem('board_2048_leaderboard');
        renderLeaderboard();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        e.preventDefault();
        if (e.key === 'ArrowUp') movePlayer(1, 'up');
        if (e.key === 'ArrowDown') movePlayer(1, 'down');
        if (e.key === 'ArrowLeft') movePlayer(1, 'left');
        if (e.key === 'ArrowRight') movePlayer(1, 'right');
      }
      if (currentMode === 2) {
        const k = e.key.toLowerCase();
        if (['w', 'a', 's', 'd'].includes(k)) {
          e.preventDefault();
          if (k === 'w') movePlayer(2, 'up');
          if (k === 's') movePlayer(2, 'down');
          if (k === 'a') movePlayer(2, 'left');
          if (k === 'd') movePlayer(2, 'right');
        }
      }
    });

    function setupSwipe(elementId, pNum) {
      const el = document.getElementById(elementId);
      if (!el) return;
      let sx = 0, sy = 0;
      el.addEventListener('touchstart', (e) => {
        sx = e.touches[0].clientX;
        sy = e.touches[0].clientY;
      }, { passive: true });
      el.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].clientX - sx;
        const dy = e.changedTouches[0].clientY - sy;
        if (Math.max(Math.abs(dx), Math.abs(dy)) > 25) {
          if (Math.abs(dx) > Math.abs(dy)) {
            movePlayer(pNum, dx > 0 ? 'right' : 'left');
          } else {
            movePlayer(pNum, dy > 0 ? 'down' : 'up');
          }
        }
      }, { passive: true });
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('p1Best').textContent = p1Best;
      renderLeaderboard();
      resetGame(1);
      resetGame(2);
      setupSwipe('p1Board', 1);
      setupSwipe('duelBoard1', 1);
      setupSwipe('duelBoard2', 2);
    });
  </script>
</body>
