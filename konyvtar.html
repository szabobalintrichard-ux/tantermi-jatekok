<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitális Könyvtár</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #1e293b;
            margin-bottom: 25px;
        }
        .vissza-gomb {
            align-self: flex-start;
            margin-bottom: 20px;
            padding: 10px 18px;
            background-color: #64748b;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.2s;
        }
        .vissza-gomb:hover {
            background-color: #475569;
        }
        .konyv-tarolo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }
        .konyv-kartya {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-top: 6px solid #2563eb;
        }
        .konyv-cim {
            font-size: 1.15rem;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 15px;
        }
        .megnyitas-gomb {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.2s;
        }
        .megnyitas-gomb:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <a href="index.html" class="vissza-gomb">← Vissza a főoldalra</a>

    <h1>Digitális Könyvtár</h1>

    <div class="konyv-tarolo">
        <!-- 4. osztályos olvasókönyv kártyája -->
        <div class="konyv-kartya">
            <div class="konyv-cim">Olvasókönyv 4. osztály</div>
            <!-- A target="_blank" új lapon nyitja meg a böngésző beépített PDF-olvasójában -->
            <a href="olvasokonyv4.pdf" target="_blank" class="megnyitas-gomb">Megnyitás (PDF)</a>
        </div>

        <!-- Ide a későbbiekben pontosan ilyen blokkokban másolhatsz be újabb könyveket -->
    </div>

</body>
</html>
